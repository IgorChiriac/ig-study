[project]
name = "ig-study-api"
version = "0.1.0"
description = "Drive proxy, folder scan, and Claude endpoints for ig-study"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "firebase-admin>=6.5",
    "google-cloud-firestore>=2.19",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
